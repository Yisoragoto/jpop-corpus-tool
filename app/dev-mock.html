const mockDict = fetch("/dev-mock-dict.json").then((r) => r.json());
// 事件：Tauri 的 listen 走 plugin:event|listen，handler 经 transformCallback 传进来。
// mock 的 transformCallback 原样返回函数，所以这里存下来，window.__emit 就能模拟后端发事件。
// 存 (id, handler)，注销时按 id 删掉——和真的 Tauri 一样。不删的话，React StrictMode 在开发模式下
// 把 effect 跑两遍，第一次注册的监听留着，每条事件会被处理两次（那只是 mock 的假象）。
window.__listeners = {};
window.__nextListenerId = 1;
window.__emit = (event, payload) =>
  (window.__listeners[event] || []).forEach(([, h]) => h({ event, payload, id: 1 }));
const dropListener = (event, id) => {
  window.__listeners[event] = (window.__listeners[event] || []).filter(([lid]) => lid !== id);
};
window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener: (event, id) => dropListener(event, id) };
window.__TAURI_INTERNALS__ = {
  invoke: (cmd, args) => {
    (window.__calls ||= []).push([cmd, args]);
    if (cmd === "plugin:event|listen") {
      const id = window.__nextListenerId++;
      (window.__listeners[args.event] ||= []).push([id, args.handler]);
      return Promise.resolve(id);
    }
    if (cmd === "plugin:event|unlisten") {
      dropListener(args.event, args.eventId);
      return Promise.resolve(null);
    }
    // 一键制卡：第二个词条假装 Anki 里已经有卡
    if (cmd === "anki_mine_check") {
      return Promise.resolve({ connected: true, message: "",
        notes: args.expressions.map((_, i) => (i === 1 ? [1789566509847] : [])) });
    }
    if (cmd === "anki_mine") {
      return new Promise((resolve) => setTimeout(() => resolve({ kind: "added", noteId: 4242, deck: args.request.artistSubdeck ? args.request.deck + "::テスト" : args.request.deck, deckCreated: !!args.request.artistSubdeck, skippedFields: [], warnings: [] }), 400));
    }
    if (cmd === "anki_model_names") return Promise.resolve(["Lapis", "JPOP Corpus"]);
    if (cmd === "anki_browse_notes") return Promise.resolve(null);
    if (cmd === "dict_list") return mockDict.then((d) => d.dictionaries);
    if (cmd === "dict_lookup") {
      return mockDict.then((d) => d.lookups[args.text] ?? { dictionaryEntries: [], originalTextLength: 0 });
    }
    if (cmd === "dict_media") return Promise.reject({ message: "mock 里没有图片" });
    if (cmd === "audio_tick") return Promise.resolve(T.audio_state);
    // 变调：假装要渲染 1.5 秒
    if (cmd === "audio_set_pitch") {
      T.audio_state = { ...T.audio_state, pitchSemitones: args.semitones, pitchRendering: args.semitones !== 0 };
      if (args.semitones !== 0) setTimeout(() => { T.audio_state = { ...T.audio_state, pitchRendering: false }; }, 1500);
      return Promise.resolve(null);
    }
    if (cmd === "library_missing_audio") {
      return Promise.resolve(window.__mockMissing ?? [{ songId: "001", title: "打ち込む歌", artist: "テスト", audioPath: "D:/old/001.flac" }]);
    }
    if (cmd === "library_suggest_relinks") {
      return Promise.resolve([{ songId: "001", path: "E:/music/テスト - 打ち込む歌.flac", reason: "标签（或文件名）里的歌手和歌名对得上" }]);
    }
    if (cmd === "library_relink_audio") {
      window.__mockMissing = [];
      return Promise.resolve({ results: args.links.map((l) => ({ songId: l.songId, error: "", durationSec: 180 })), csv: "updated" });
    }
    if (cmd === "library_edit_song") {
      T.list_tracks = T.list_tracks.map((t) => (t.id === args.songId ? { ...t, ...args.edit } : t));
      return Promise.resolve({ changed: ["title"], performers: 0, albumId: null, correctionsRenamed: 0, albumsRemoved: 0, peopleRemoved: 0, csv: "updated" });
    }
    if (cmd === "get_track") return Promise.resolve(T.list_tracks.find((t) => t.id === args.songId) ?? null);
    if (cmd === "library_delete_song") {
      T.list_tracks = T.list_tracks.filter((t) => t.id !== args.songId);
      return Promise.resolve({ title: "打ち込む歌", artist: "テスト", audioPath: "", coverPath: "", lyricLines: 2, tokens: 12, credits: 1, plays: 0,
        correctionsKept: 0, albumsRemoved: 0, peopleRemoved: 1, coverRemoved: false, pitchCacheRemoved: 0, csv: "updated" });
    }
    if (cmd === "fonts_catalog") {
      return Promise.resolve({ installed: [{ name: "Meiryo", aliases: ["メイリオ"] }, { name: "Yu Gothic UI", aliases: [] }, { name: "Arial", aliases: [] }],
        files: [], problems: [] });

    if (cmd === "lyrics_furigana") {
      const kanji = { 2: [{ start: 0, end: 1, reading: "はる" }, { start: 3, end: 4, reading: "おも" }, { start: 5, end: 6, reading: "だ" }, { start: 8, end: 10, reading: "ひび" }],
                      1: [{ start: 0, end: 1, reading: "う" }, { start: 2, end: 3, reading: "こ" }] };
      const word = { 2: [{ start: 0, end: 1, reading: "はる" }, { start: 3, end: 7, reading: "おもいだし" }, { start: 8, end: 10, reading: "ひび" }],
                     1: [{ start: 0, end: 4, reading: "うちこん" }] };
      const table = args.mode === "word" ? word : kanji;
      return Promise.resolve([2, 1].map((id) => ({ utteranceId: id, rubies: table[id] })));
    }
    if (cmd === "people_by_role") {
      return Promise.resolve([
        { id: 1, name: "ヨルシカ", role: "performer", trackCount: 41, imagePath: "" },

          topWords: [["の", 2931], ["だ", 2012], ["た", 1788]] } });

    if (cmd === "home_summary") return Promise.resolve({ overview: OVERVIEW,

      decades: [], topWords: [] });
