name: macOS client

# 原生 macOS 客户端（macos/）的门禁：构建 Rust 核心静态库 → swift build → swift test。
# Swift 测试经真的 libjp_ffi.a 调 Rust，对着合成语料库检查跨语言的数据形状和「检索 → KWIC → 定位」那条链路，
# 以及「空目录建库 → 导入音频 + .lrc → 装分词词典、补分词 → KWIC」那条（要一份 Sudachi 词典，缓存着，见下）。
# 作者在 Windows 上开发，这里是 Swift 代码唯一会被编译、运行的地方。
on:
  push:
    branches: ["main"]
    paths: ["macos/**", "rust/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", "rust/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      # 分词词典：和应用下载的是同一个发布、同一个哈希（jp-setup/src/sudachi.rs）。
      # 207MB，缓存起来，只在第一次（或换了词典）时下。Rust 和 Swift 的导入测试经 JP_SUDACHI_SOURCE 用它
      - name: Sudachi dictionary (cache)
        id: sudachi
        uses: actions/cache@v4
        with:
          path: ~/sudachi-dict/system.dic
          key: sudachi-system-dic-a4c0cfea5674e1e9

      - name: Sudachi dictionary (download)
        if: steps.sudachi.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/sudachi-dict
          url=https://github.com/Yisoragoto/jpop-corpus-tool/releases/download/sudachi-dict-core/system.dic.xz
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/system.dic.xz" "$url"
          echo "5ba334f1ac976ae6f77f8f92d26cef9bc44a9c2cf0d723545432fcd43df2db5b  $RUNNER_TEMP/system.dic.xz" | shasum -a 256 -c
          unxz=(python3 -c "import lzma, shutil, sys; shutil.copyfileobj(lzma.open(sys.argv[1]), open(sys.argv[2], 'wb'))")
          "${unxz[@]}" "$RUNNER_TEMP/system.dic.xz" ~/sudachi-dict/system.dic
          echo "a4c0cfea5674e1e9cfcbd3cf05bb45576b533c3944e60b7dbbea022423a1866a  $HOME/sudachi-dict/system.dic" | shasum -a 256 -c

      - name: Sudachi dictionary (resources)
        run: |
          cp rust/crates/jp-tokenizer/resources/{sudachi.json,char.def,unk.def,rewrite.def} ~/sudachi-dict/
          echo "JP_SUDACHI_SOURCE=$HOME/sudachi-dict" >> "$GITHUB_ENV"

      - name: Rust core (jp-ffi) tests
        working-directory: rust
        run: cargo test -p jp-ffi -p jp-corpus -p jp-setup --lib --no-fail-fast

      - name: Build libjp_ffi.a
        run: ./macos/scripts/build-rust.sh

      - name: Swift build
        working-directory: macos
        run: swift build

      - name: Swift tests
        working-directory: macos
        run: swift test

      - name: App bundle
        working-directory: macos
        run: ./scripts/bundle.sh

      # 冒烟：真的把 .app 跑起来走一遍「检索 → KWIC → 试听 → 曲库 → 分析 → 导入」，窗口自己截图（不需要录屏权限）。
      # 示例库的歌指向 E:/music/00x.flac，这里生成同名的 FLAC（440Hz 正弦，afconvert 是系统自带的），播放那条路也走到。
      # 截图和 smoke.txt 传成 artifact：没有 Mac 也能看到真实界面。
      - name: Smoke run (screenshots)
        working-directory: macos
        run: |
          audio="$RUNNER_TEMP/smoke-audio"; out="$RUNNER_TEMP/smoke"
          mkdir -p "$audio" "$out"
          python3 - "$audio/tone.wav" <<'PY'
          import math, struct, sys, wave
          rate = 22050
          with wave.open(sys.argv[1], "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
              w.writeframes(b"".join(struct.pack("<h", int(8000 * math.sin(2 * math.pi * 440 * i / rate))) for i in range(rate * 300)))
          PY
          for id in 001 002 003 004; do afconvert -f flac -d flac "$audio/tone.wav" "$audio/$id.flac"; done
          # 示例库 004 的封面记的是 E:/music/covers/004.jpg：生成一张彩色渐变图放到 covers/ 下，
          # 歌词面板的虚化封面底和播放条的小封面都能走到（按路径尾巴 covers/004.jpg 找）
          mkdir -p "$audio/covers"
          python3 - "$audio/covers/004.png" <<'PY'
          import struct, sys, zlib
          w = h = 256
          rows = b"".join(b"\x00" + bytes(v for x in range(w) for v in (255 - y // 2, 80 + x // 3, 120 + y // 3)) for y in range(h))
          chunk = lambda t, d: struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(rows)) + chunk(b"IEND", b"")
          open(sys.argv[1], "wb").write(png)
          PY
          sips -s format jpeg "$audio/covers/004.png" --out "$audio/covers/004.jpg" >/dev/null
          app="$PWD/build/JPOP Corpus.app"
          set +e
          # 先直接跑可执行文件（stderr 里有 [smoke] 生命周期日志）
          JPCORPUS_SMOKE="$out" JPCORPUS_SMOKE_AUDIO="$audio" perl -e 'alarm shift; exec @ARGV' 120 "$app/Contents/MacOS/JPCorpus"
          echo "direct exit=$?"
          # 没出截图就经 LaunchServices 再开一次：GUI 应用通常要这样才拿得到窗口服务器的会话
          if [ ! -f "$out/02-kwic.png" ]; then
            open -W -n --env JPCORPUS_SMOKE="$out" --env JPCORPUS_SMOKE_AUDIO="$audio" \
              --stdout "$out/stdout.txt" --stderr "$out/stderr.txt" "$app" &
            pid=$!; ( sleep 120; kill $pid 2>/dev/null; pkill -f "JPOP Corpus.app" ) & wait $pid
            echo "open exit=$?"
            cat "$out/stderr.txt" 2>/dev/null
          fi
          log show --last 3m --style compact --predicate 'process == "JPCorpus"' 2>/dev/null | tail -60
          set -e
          cat "$out/smoke.txt" 2>/dev/null || true
          ls -la "$out"
          test -f "$out/02-kwic.png"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-smoke-screenshots
          path: ${{ runner.temp }}/smoke
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: JPOP-Corpus-macOS-unsigned
          path: macos/build/JPOP Corpus.app
          retention-days: 7
