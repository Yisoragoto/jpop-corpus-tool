name: Check

# 每次推 main 和每个 PR 都跑：测试、lint、类型检查。**不构建安装包**——
# 那一步要十几分钟，而它证明的是「能打包」，不是「代码对不对」。
#
# 为什么单独一个 workflow：原来只有 release.yml，只在打 v* 标签时跑。
# 等标签推上去的时候版本已经发出去了，这不是门禁，是事后报告——
# 实际结果是 v0.2.2~v0.2.7 连着六次 CI 失败而没人看见。
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一个分支连着推几次时，只留最后一次
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      # 音频测试在没有输出设备的机器上会自己跳过（engine_or_skip!），
      # 要真实语料库的那些标了 #[ignore]。两类都会在日志里说一声。
      #
      # 会在这台机器上**整组跳过**的三个套件，单独不吞输出地跑一遍。
      #
      # 跳过也打 ok，所以不开 --nocapture 根本分不清「跑过了」还是「跳过了」——
      # 「测试全绿」在 CI 的含义会比在本机弱得多，而且自己都不知道弱在哪。
      # 这一步把每条 [skip] 打出来，弱在哪儿一眼看得见：
      #
      #   jp-audio    没有音频输出设备
      #   commands    没有那个 991MB 的真实 corpus.db（78 个里 78 个跳过）
      #   real_corpus 同上（36 个全跳过）
      #
      # 真正不挑机器的那组是 tests/fixture_commands.rs，它在下面的 workspace 里跑。
      - name: Tests (跳过情况要看得见)
        working-directory: rust
        run: |
          cargo test -p jp-audio --lib -- --nocapture
          cargo test -p jp-app --test commands -- --nocapture
          cargo test -p jp-corpus --test real_corpus -- --nocapture

      # --no-fail-fast：一个 crate 崩掉不该把后面所有 crate 的结果一起藏起来。
      # jp-audio 这个崩溃被 jp-app 的一个失败挡了八次 CI 没人看见，就是因为没有它。
      - name: Tests
        working-directory: rust
        run: cargo test --workspace --no-fail-fast

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Unit tests
        working-directory: app
        run: npm test

  versions:
    # 三处版本号必须一致。对不上的话构建出来的安装包文件名和 about 页会互相打架，
    # 而这件事只有发版当天才会被发现。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions agree
        run: |
          tauri=$(grep -oP '"version":\s*"\K[^"]+' rust/crates/jp-app/tauri.conf.json | head -1)
          cargo=$(grep -oP '^version = "\K[^"]+' rust/crates/jp-app/Cargo.toml | head -1)
          pkg=$(grep -oP '"version":\s*"\K[^"]+' app/package.json | head -1)
          echo "tauri.conf.json=$tauri  Cargo.toml=$cargo  package.json=$pkg"
          test "$tauri" = "$cargo" -a "$cargo" = "$pkg"
