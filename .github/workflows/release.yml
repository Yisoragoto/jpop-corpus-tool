name: Windows / macOS stable / debug
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: debug 滚动预发布 / stable 手动正式发布
        type: choice
        options: [debug, stable]
        default: debug
        required: true
      replace_existing:
        description: 明确替换已有正式版（仅手动 stable，默认不覆盖）
        type: boolean
        default: false
permissions:
  contents: read
# 排队而不是取消：发布那一步是「删旧 Release → 建新 Release」，在中间被取消，
# debug 轨道会暂时没有 Release，手动重发正式版时更会把旧版删掉却没建出新版。
concurrency:
  group: windows-release-${{ inputs.channel || 'debug' }}
  cancel-in-progress: false
jobs:
  # 两个平台共用的发布身份：策略（这次出不出包、发哪个轨道）和构建编号。
  # 构建编号在这里算一次：Windows 包、macOS 包里嵌的是同一个值，客户端的 debug 轨道按它判断有没有新构建
  identity:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.policy.outputs.build }}
      publish: ${{ steps.policy.outputs.publish }}
      channel: ${{ steps.policy.outputs.channel }}
      tag: ${{ steps.policy.outputs.tag }}
      build_id: ${{ steps.id.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Release policy
        id: policy
        shell: pwsh
        env:
          INPUT_CHANNEL: ${{ inputs.channel || 'debug' }}
        run: ./scripts/check-release-policy.ps1
      - name: Build identity
        id: id
        run: echo "build_id=${GITHUB_SHA:0:12}-$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

  windows:
    needs: identity
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # checkout 后才有本次提交的守卫；它是构建前第一项检查。
      - name: Release policy
        id: policy
        shell: pwsh
        env:
          INPUT_CHANNEL: ${{ inputs.channel || 'debug' }}
        run: ./scripts/check-release-policy.ps1
      - name: Build identity
        if: steps.policy.outputs.build == 'true'
        shell: pwsh
        env:
          BUILD_ID: ${{ needs.identity.outputs.build_id }}
        run: |
          if (-not $env:BUILD_ID) { throw '缺少共用的构建编号' }
          "JPOP_BUILD_ID=$env:BUILD_ID" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        if: steps.policy.outputs.build == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        if: steps.policy.outputs.build == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.policy.outputs.build == 'true'
        with:
          workspaces: rust -> target
      - name: Frontend checks
        if: steps.policy.outputs.build == 'true'
        working-directory: app
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Rust and release policy checks
        if: steps.policy.outputs.build == 'true'
        working-directory: rust
        run: |
          ../scripts/tests/release-policy.Tests.ps1
          cargo test --workspace --no-fail-fast
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build installer
        if: steps.policy.outputs.build == 'true'
        working-directory: app
        run: npm run app:build
      - name: Prepare assets
        if: steps.policy.outputs.publish == 'true'
        shell: pwsh
        env:
          CHANNEL: ${{ steps.policy.outputs.channel }}
        run: |
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installer = @(Get-Item "rust/target/release/bundle/nsis/*_${version}_x64-setup.exe")
          if ($installer.Count -ne 1) { throw '必须恰好有一份 NSIS 安装包' }
          $file = if ($env:CHANNEL -eq 'debug') { "JPOP.Corpus.Tool_${version}-debug.exe" } else { "JPOP.Corpus.Tool_${version}_x64-setup.exe" }
          Copy-Item -LiteralPath $installer[0].FullName -Destination "release-assets/$file"
          if ($env:CHANNEL -eq 'debug') {
            @{
              buildId = $env:JPOP_BUILD_ID; version = $version; file = $file
              sha256 = (Get-FileHash "release-assets/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
              size = (Get-Item "release-assets/$file").Length
            } | ConvertTo-Json | Set-Content release-assets/latest.json -Encoding utf8NoBOM
          } else {
            Copy-Item "rust/target/release/bundle/msi/*.msi" release-assets/
          }
          $notes = "docs/releases/v$version.md"
          if ($env:CHANNEL -eq 'stable' -and (Test-Path -LiteralPath $notes)) {
            Get-Content -LiteralPath $notes -Raw | Set-Content release-notes.md -Encoding utf8NoBOM
          } else {
            "自动构建：$env:GITHUB_SHA / $([DateTime]::UtcNow.ToString('o')) / build $env:JPOP_BUILD_ID" | Set-Content release-notes.md -Encoding utf8NoBOM
          }
      - name: Publish verified channel
        if: steps.policy.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.policy.outputs.channel }}
          RELEASE_TAG: ${{ steps.policy.outputs.tag }}
          REPLACE_EXISTING: ${{ inputs.replace_existing || false }}
        run: |
          $assets = @(Get-ChildItem release-assets -File | ForEach-Object FullName)
          if ($env:CHANNEL -eq 'debug') {
            if ($assets.Count -ne 2) { throw 'debug 只能包含安装包和 latest.json' }
            gh release view debug *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release delete debug --yes --cleanup-tag
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
            # 删掉重建，避免把上一轮安装包留在滚动 Release 里。
            gh release create debug --target $env:GITHUB_SHA --prerelease --latest=false --title 'debug build' --notes-file release-notes.md @assets
          } else {
            # 2026-10-22 维护者明确要求替换 0.3.3：仅在手动选择覆盖时，包构建完再删旧版重建。
            if ($env:REPLACE_EXISTING -eq 'true') {
              gh release view $env:RELEASE_TAG *> $null
              if ($LASTEXITCODE -eq 0) {
                gh release delete $env:RELEASE_TAG --yes --cleanup-tag
                if ($LASTEXITCODE) { exit $LASTEXITCODE }
              }
            }
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --latest --title $env:RELEASE_TAG --notes-file release-notes.md @assets
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: steps.policy.outputs.build == 'true'
        with:
          name: jpop-corpus-tool-${{ steps.policy.outputs.channel }}
          path: release-assets/*
          if-no-files-found: error

  # macOS 安装包（Apple Silicon，未签名、未公证），两个轨道都出，和 Windows 同时构建。
  # Release 由上面的 windows 作业建（debug 是删掉重建），建好之后再把 .dmg 挂上去：
  #   stable：JPOP.Corpus.Tool_<版本>_macOS_arm64.dmg
  #   debug ：JPOP.Corpus.Tool_<版本>-debug_macOS_arm64.dmg + latest-macos.json（macOS 客户端的 debug 轨道读它，
  #           格式和 Windows 的 latest.json 一样；构建编号和 Windows 包是同一个）
  macos:
    needs: identity
    if: needs.identity.outputs.publish == 'true'
    runs-on: macos-15
    env:
      JPOP_BUILD_ID: ${{ needs.identity.outputs.build_id }}
      CHANNEL: ${{ needs.identity.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Build libjp_ffi.a
        run: |
          test -n "$JPOP_BUILD_ID"
          ./macos/scripts/build-rust.sh
      - name: App bundle
        working-directory: macos
        run: ./scripts/bundle.sh
      - name: Disk image
        run: |
          version="$(node -p "require('./app/package.json').version")"
          test -n "$version"
          if [ "$CHANNEL" = debug ]; then file="JPOP.Corpus.Tool_${version}-debug_macOS_arm64.dmg"
          else file="JPOP.Corpus.Tool_${version}_macOS_arm64.dmg"; fi
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage" release-assets
          cp -R "macos/build/JPOP Corpus.app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "JPOP Corpus" -srcfolder "$stage" -ov -format UDZO "release-assets/$file"
          if [ "$CHANNEL" = debug ]; then
            python3 - "$version" "$file" <<'PY'
          import hashlib, json, os, sys
          version, file = sys.argv[1], sys.argv[2]
          path = os.path.join("release-assets", file)
          digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
          manifest = {"buildId": os.environ["JPOP_BUILD_ID"], "version": version, "file": file,
                      "sha256": digest, "size": os.path.getsize(path)}
          open("release-assets/latest-macos.json", "w").write(json.dumps(manifest, indent=2))
          PY
          fi
          ls -la release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: jpop-corpus-tool-macos
          path: release-assets/*
          if-no-files-found: error

  macos-publish:
    needs: [identity, windows, macos]
    if: needs.identity.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jpop-corpus-tool-macos
          path: release-assets
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.identity.outputs.tag }}
        run: |
          test -n "$TAG"
          gh release upload "$TAG" release-assets/* --clobber
