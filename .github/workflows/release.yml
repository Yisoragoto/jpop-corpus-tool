name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = "${{ inputs.version }}"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Install build tools
        shell: pwsh
        run: |
          choco install innosetup ffmpeg --no-progress -y
          ffmpeg -version

      - name: Build portable app and installer
        shell: pwsh
        run: |
          $ffmpeg = (Get-Command ffmpeg.exe).Source
          .\packaging\build_windows.ps1 -Version "${{ steps.version.outputs.value }}" -FfmpegPath $ffmpeg

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JpopCorpusTool-${{ steps.version.outputs.value }}-windows
          path: |
            dist/JpopCorpusTool-${{ steps.version.outputs.value }}-windows-portable.zip
            dist/JpopCorpusTool-${{ steps.version.outputs.value }}-windows-setup.exe

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/JpopCorpusTool-${{ steps.version.outputs.value }}-windows-portable.zip
            dist/JpopCorpusTool-${{ steps.version.outputs.value }}-windows-setup.exe
