name: Build Windows release

# 打 v* 标签或手动触发时构建一次 Windows 安装包，产物挂在 workflow artifacts 上。
# **不自动发 Release**：发版是人工动作（本地跑完检查、确认过安装包能装能跑再发），
# CI 在这里的职责是「证明这份源码能从零构建出来」。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Typecheck and unit tests (frontend)
        working-directory: app
        run: |
          npm run typecheck
          npm test

      # 音频相关的测试在没有输出设备的机器上会自己跳过（engine_or_skip!），
      # 要真实语料库的那些标了 #[ignore]
      - name: Tests and lints (Rust)
        working-directory: rust
        run: |
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Build installer
        working-directory: app
        run: npm run app:build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: jpop-corpus-tool-windows
          path: |
            rust/target/release/bundle/nsis/*.exe
            rust/target/release/bundle/msi/*.msi
          if-no-files-found: error
