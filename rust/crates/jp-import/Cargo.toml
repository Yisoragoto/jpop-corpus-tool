[package]
name = "jp-import"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Library scanning and import for JPOP Corpus Tool"

[dependencies]
anyhow.workspace = true
serde.workspace = true
lofty = "0.25"
# NFKC 归一化。已经在依赖树里（sudachi.rs 用了它），不引入新下载。
unicode-normalization = "0.1"
# feat. 片段剥离，和 Python 的 _FEAT_RE 对齐。已在依赖树里。
regex = "1"
serde_json.workspace = true
# 所有歌词格式的解析（LRC / SRT / TTML / QRC / YRC / KRC / LYS）
jp-lyric-format = { path = "../jp-lyric-format" }
rusqlite = { version = "0.40", features = ["bundled"] }
jp-corpus = { path = "../jp-corpus" }
jp-tokenizer = { path = "../jp-tokenizer" }

[dev-dependencies]
