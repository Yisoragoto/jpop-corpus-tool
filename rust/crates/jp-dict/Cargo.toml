[package]
name = "jp-dict"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Yomitan-style dictionary lookup for JPOP Corpus Tool (deinflection and lookup ported from Yomitan)"

[dependencies]
anyhow.workspace = true
serde.workspace = true
# raw_value：导入时释义先按原始 JSON 片段借用，不把几十 MB 的 term_bank 整个建成树
serde_json = { workspace = true, features = ["raw_value"] }
# 读 Yomitan 词典 zip、压缩释义块。两个都已在依赖树里，不引入新下载。
flate2 = "1"
crc32fast = "1"
# 词典库是独立的 dictionaries.db，不和 corpus.db 混在一起。
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
# 只给 examples/song_occurrences.rs 读真实歌词用
jp-corpus = { path = "../jp-corpus" }
