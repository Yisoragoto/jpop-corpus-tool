[package]
name = "jp-scraper"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metadata resolution pipeline: query, providers, matching, persistence"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
regex = "1"
# Jaro-Winkler。Python 侧用 rapidfuzz，实现同一个算法，已对过账。
strsim = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
jp-normalize = { path = "../jp-normalize" }
ureq = { version = "3.4.1", features = ["rustls"], optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
# 真实 HTTP 传输层。核心逻辑（打分、判定、落库）不依赖它，
# 关掉之后这个 crate 完全不碰网络栈。
default = ["network"]
network = ["dep:ureq"]
