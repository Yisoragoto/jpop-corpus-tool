[package]
name = "jp-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI over the JPOP Corpus core, for the native macOS (SwiftUI) client"

[lib]
# staticlib：Swift 包链接 libjp_ffi.a；rlib：本 crate 自己的测试和别的 Rust 代码用
crate-type = ["staticlib", "rlib"]

[dependencies]
jp-update = { path = "../jp-update" }
jp-diagnostics = { path = "../jp-diagnostics" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
jp-corpus = { path = "../jp-corpus" }
jp-lyrics = { path = "../jp-lyrics" }
jp-fonts = { path = "../jp-fonts" }
jp-audio = { path = "../jp-audio" }
# 导入（扫描 → 计划 → 写库）、分词、分词词典的下载和定位、查词：和 Tauri 客户端是同一份代码
jp-import = { path = "../jp-import" }
jp-tokenizer = { path = "../jp-tokenizer" }
jp-setup = { path = "../jp-setup" }
jp-dict = { path = "../jp-dict" }
# 一键制卡（AnkiConnect）：和 Tauri 客户端同一份 jp_anki::lyric_mine
jp-anki = { path = "../jp-anki" }
# 刮削元数据、封面、歌手照片：和 Tauri 客户端同一份 jp-scrape
jp-scrape = { path = "../jp-scrape" }

jp-library = { path = "../jp-library" }

jp-scraper = { path = "../jp-scraper" }
