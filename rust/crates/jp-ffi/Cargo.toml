[package]
name = "jp-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI over the JPOP Corpus core, for the native macOS (SwiftUI) client"

[lib]
# staticlib：Swift 包链接 libjp_ffi.a；rlib：本 crate 自己的测试和别的 Rust 代码用
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
jp-corpus = { path = "../jp-corpus" }
